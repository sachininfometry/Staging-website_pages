name: Validate WordPress templates

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate Informatica preview
        run: php tools/render-informatica-preview.php
      - name: Confirm generated preview is current
        run: git diff --exit-code -- preview-informatica.html
      - name: Validate project
        shell: pwsh
        run: ./tools/verify-project.ps1
